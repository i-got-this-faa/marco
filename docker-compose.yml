services:
  marco:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26-alpine AS builder
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -ldflags '-s -w' -o /marco ./cmd/marco

        FROM alpine:latest
        RUN apk add --no-cache ca-certificates tzdata
        COPY --from=builder /marco /usr/local/bin/marco
        EXPOSE ${SMTP_PORT:-25} ${SUBMISSION_PORT:-587} ${SUBMISSIONS_PORT:-465} ${IMAP_PORT:-143} ${IMAPS_PORT:-993} ${ACMEPORT:-80} ${HTTPS_PORT:-443} ${ADMIN_PORT:-8080}
        ENTRYPOINT ["marco"]
    hostname: ${HOSTNAME:-mail.example.com}
    ports:
      - "${SMTP_PORT:-25}:${SMTP_PORT:-25}"
      - "${SUBMISSION_PORT:-587}:${SUBMISSION_PORT:-587}"
      - "${SUBMISSIONS_PORT:-465}:${SUBMISSIONS_PORT:-465}"
      - "${IMAP_PORT:-143}:${IMAP_PORT:-143}"
      - "${IMAPS_PORT:-993}:${IMAPS_PORT:-993}"
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    volumes:
      - marco-data:/var/lib/marco
      - ./marco.toml:/etc/marco/config.toml:ro
    restart: unless-stopped

volumes:
  marco-data:
