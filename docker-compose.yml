services:
  marco:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: ${HOSTNAME:-mail.example.com}
    ports:
      - "${SMTP_PORT:-25}:${SMTP_PORT:-25}"
      - "${SUBMISSION_PORT:-587}:${SUBMISSION_PORT:-587}"
      - "${SUBMISSIONS_PORT:-465}:${SUBMISSIONS_PORT:-465}"
      - "${IMAP_PORT:-143}:${IMAP_PORT:-143}"
      - "${IMAPS_PORT:-993}:${IMAPS_PORT:-993}"
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    volumes:
      - marco-data:/var/lib/marco
      - ./marco.toml:/etc/marco/config.toml:ro
    restart: unless-stopped

volumes:
  marco-data:
